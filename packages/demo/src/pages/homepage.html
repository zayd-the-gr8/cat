<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>aisle</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@300..900&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				color-scheme: dark;
				font-family: "Bitcount Grid Single", monospace;
				background: #050505;
				color: #f5f5f5;
			}

			* {
				box-sizing: border-box;
			}

			body {
				display: grid;
				width: 100%;
				min-width: 240px;
				min-height: 100vh;
				margin: 0;
				place-items: center;
				background-color: #050505;
				background-image:
					linear-gradient(rgb(255 255 255 / 6%) 1px, transparent 1px),
					linear-gradient(90deg, rgb(255 255 255 / 6%) 1px, transparent 1px),
					radial-gradient(ellipse at center, #171717 0, #090909 48%, #030303 78%);
				background-size:
					32px 32px,
					32px 32px,
					100% 100%;
			}

			main {
				display: flex;
				width: min(420px, calc(100% - 40px));
				flex-direction: column;
				align-items: center;
				gap: clamp(42px, 10vh, 68px);
				padding: 24px 0;
			}

			h1 {
				margin: 0;
				color: #f5f5f5;
				font-size: clamp(2.5rem, 11vw, 3.5rem);
				font-weight: 500;
				letter-spacing: 0.02em;
				line-height: 1;
				text-shadow: 0 0 18px rgb(255 255 255 / 22%);
			}

			.search-hint {
				display: grid;
				width: 100%;
				min-height: 48px;
				padding: 0 20px;
				place-items: center;
				border: 1px solid #111;
				border-radius: 999px;
				background: #030303;
				box-shadow: 0 0 32px rgb(255 255 255 / 10%);
				color: #686868;
				font-size: 0.85rem;
				letter-spacing: 0.04em;
				text-align: center;
				transition:
					border-color 180ms ease,
					box-shadow 180ms ease,
					color 180ms ease;
			}

			.search-hint:hover {
				border-color: #444;
				box-shadow: 0 0 34px rgb(255 255 255 / 18%);
				color: #aaa;
			}

			@media (prefers-reduced-motion: reduce) {
				.search-hint {
					transition: none;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<h1>/isle</h1>
			<div class="search-hint">search, or type a url</div>
		</main>
	</body>
</html>
